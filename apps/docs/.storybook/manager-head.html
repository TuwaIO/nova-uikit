<script>
  // Storybook writes its keyboard shortcuts and the recently viewed pages to localStorage as soon as
  // the explorer opens. Keep both in memory only, so nothing is stored before the visitor acts
  // (TUWA Cookie Policy), and drop what earlier versions of this site stored.
  (function () {
    var memoryKeys = ['@storybook/manager/store', 'lastViewedStoryIds'];
    var memory = {};
    var proto = Storage.prototype;
    var getItem = proto.getItem;
    var setItem = proto.setItem;
    var removeItem = proto.removeItem;
    var inMemory = function (storage, key) {
      return storage === window.localStorage && memoryKeys.indexOf(String(key)) !== -1;
    };
    try {
      memoryKeys.forEach(function (key) {
        removeItem.call(window.localStorage, key);
      });
    } catch (e) {
      // Storage unavailable: nothing to clean up
    }
    proto.setItem = function (key, value) {
      if (inMemory(this, key)) {
        memory[key] = String(value);
        return;
      }
      return setItem.call(this, key, value);
    };
    proto.getItem = function (key) {
      if (inMemory(this, key)) {
        return Object.prototype.hasOwnProperty.call(memory, key) ? memory[key] : null;
      }
      return getItem.call(this, key);
    };
    proto.removeItem = function (key) {
      if (inMemory(this, key)) {
        delete memory[key];
        return;
      }
      return removeItem.call(this, key);
    };
  })();
</script>

<style>
  /*
   * The theme and language switches of the TUWA documentation sites, ported from @tuwaio/docs-ui 0.10 (site.css), at
   * their desktop size: the manager loads no docs-ui stylesheet, and its theme is html[data-tuwa-theme], not .dark
   */
  html[data-tuwa-theme='light'] {
    --tuwa-border-primary: #e5e7eb;
    --tuwa-bg-primary: #ffffff;
    --tuwa-text-accent: #0052ff;
    --tuwa-rounded-corners: 6px;
  }
  html[data-tuwa-theme='dark'] {
    --tuwa-border-primary: #1e293b;
    --tuwa-bg-primary: #0a0e27;
    --tuwa-text-accent: #38bdf8;
    --tuwa-rounded-corners: 6px;
  }

  /* The light/dark switch (ThemeSwitcher), in the cosmic manner of TUWA and flat: the sizes of the switch before it (80 ×
     40 on a phone, 64 × 32 from md), a knob that slides with a spring and stretches on its way (the sun on the left, the
     moon on the right), pixel art that rebuilds itself, a twinkle, an orbit and a glow along an edge of the knob */
  .tuwa-theme-switch {
    --knob: 26px;
    --pixel-step: 2.5px;
    --glow: #f59e0b;
    --pixel: #c2410c;
    position: relative;
    display: inline-flex;
    flex-shrink: 0;
    width: 64px;
    height: 32px;
    padding: 0;
    border: 1px solid rgb(0 0 0 / 0.06);
    border-radius: var(--tuwa-rounded-corners);
    background: rgb(0 0 0 / 0.05);
    cursor: pointer;
    transition: border-color 200ms ease;
    /* The tilted orbit of the satellite or the planet, in the knob (its box inside the border) */
    --orbit-path: path('M 1.95 16.47 A 11 4 -24 1 0 22.05 7.53 A 11 4 -24 1 0 1.95 16.47');
  }
  .tuwa-theme-switch--dark {
    border-color: rgb(255 255 255 / 0.1);
    background: rgb(255 255 255 / 0.08);
    --glow: var(--tuwa-text-accent);
    --pixel: color-mix(in srgb, var(--tuwa-text-accent) 55%, #ffffff);
  }
  .tuwa-theme-switch--placeholder {
    opacity: 0;
    cursor: default;
  }
  .tuwa-theme-switch:hover {
    border-color: color-mix(in srgb, var(--glow) 50%, var(--tuwa-border-primary));
  }
  .tuwa-theme-switch:focus-visible {
    outline: 2px solid var(--tuwa-text-accent);
    outline-offset: 2px;
  }

  .tuwa-theme-switch__knob {
    position: absolute;
    top: 50%;
    left: 2px;
    display: grid;
    place-items: center;
    width: var(--knob);
    height: var(--knob);
    translate: 0 -50%;
    border: 1px solid var(--tuwa-border-primary);
    border-radius: var(--tuwa-rounded-corners);
    background: var(--tuwa-bg-primary);
    box-shadow:
      0 1px 2px rgb(0 0 0 / 0.08),
      0 0 10px -4px var(--glow);
    transition: box-shadow 300ms ease;
  }
  .tuwa-theme-switch--dark .tuwa-theme-switch__knob {
    left: calc(100% - var(--knob) - 3px);
  }
  .tuwa-theme-switch:hover .tuwa-theme-switch__knob {
    box-shadow:
      0 1px 2px rgb(0 0 0 / 0.08),
      0 0 14px -3px var(--glow);
  }
  .tuwa-theme-switch__knob--to-dark {
    animation: tuwa-knob-to-dark 480ms cubic-bezier(0.34, 1.3, 0.64, 1) both;
  }
  .tuwa-theme-switch__knob--to-light {
    animation: tuwa-knob-to-light 480ms cubic-bezier(0.34, 1.3, 0.64, 1) both;
  }
  @keyframes tuwa-knob-to-dark {
    0% {
      left: 2px;
      width: var(--knob);
    }
    45% {
      width: calc(var(--knob) * 1.45);
    }
    100% {
      left: calc(100% - var(--knob) - 3px);
      width: var(--knob);
    }
  }
  @keyframes tuwa-knob-to-light {
    0% {
      left: calc(100% - var(--knob) - 3px);
      width: var(--knob);
    }
    45% {
      width: calc(var(--knob) * 1.45);
    }
    100% {
      left: 2px;
      width: var(--knob);
    }
  }

  /* The glow along an edge, wrapping a little onto the sides: warm amber over the sun, the accent under the moon. The
     border of the knob, masked to its edge; the halo follows what shows of it. Quiet: it sits in a header */
  .tuwa-theme-switch__glow {
    position: absolute;
    inset: -1px;
    border-radius: inherit;
    pointer-events: none;
    filter: drop-shadow(0 0 1.5px color-mix(in srgb, var(--glow) 60%, transparent))
      drop-shadow(0 0 4px color-mix(in srgb, var(--glow) 28%, transparent));
    opacity: 0;
    transition: opacity 300ms ease 160ms;
  }
  .tuwa-theme-switch__glow::before {
    content: '';
    position: absolute;
    inset: 0;
    border: 1px solid var(--glow);
    border-radius: inherit;
  }
  .tuwa-theme-switch__glow--top::before {
    mask-image: linear-gradient(to bottom, #000 0%, #000 18%, transparent 46%);
  }
  .tuwa-theme-switch__glow--bottom::before {
    mask-image: linear-gradient(to top, #000 0%, #000 18%, transparent 46%);
  }
  .tuwa-theme-switch--light .tuwa-theme-switch__glow--top,
  .tuwa-theme-switch--dark .tuwa-theme-switch__glow--bottom {
    opacity: 0.85;
  }

  /* The pixels: solid (a hair larger than their step, so no seam shows between two of them), each travels to its place in
     the other picture, one after another */
  .tuwa-theme-switch__pixels {
    position: relative;
    width: calc(var(--pixel-step) * 7);
    height: calc(var(--pixel-step) * 7);
  }
  /* A warm halo behind the disc of the sun, so it reads as the sun at a glance */
  .tuwa-theme-switch__pixels::before {
    content: '';
    position: absolute;
    inset: calc(var(--pixel-step) * 0.5);
    border-radius: 50%;
    background: radial-gradient(circle, rgb(251 191 36 / 0.42) 0%, rgb(251 191 36 / 0.12) 45%, transparent 70%);
    opacity: 0;
    transition: opacity 500ms ease 200ms;
  }
  .tuwa-theme-switch--light .tuwa-theme-switch__pixels::before {
    opacity: 1;
  }
  .tuwa-theme-switch__pixel {
    position: absolute;
    top: 0;
    left: 0;
    width: calc(var(--pixel-step) + 0.2px);
    height: calc(var(--pixel-step) + 0.2px);
    background: var(--pixel);
    transform: translate(calc(var(--x) * var(--pixel-step)), calc(var(--y) * var(--pixel-step)));
    transition:
      transform 560ms cubic-bezier(0.34, 1.35, 0.64, 1) var(--delay),
      opacity 260ms ease var(--delay),
      border-radius 400ms ease var(--delay),
      background-color 300ms ease;
  }
  /* The corners of the disc of the sun round it */
  .tuwa-theme-switch__pixel--tl {
    border-top-left-radius: 100%;
  }
  .tuwa-theme-switch__pixel--tr {
    border-top-right-radius: 100%;
  }
  .tuwa-theme-switch__pixel--bl {
    border-bottom-left-radius: 100%;
  }
  .tuwa-theme-switch__pixel--br {
    border-bottom-right-radius: 100%;
  }
  /* The stars dim and shine once, slowly, after a change, then shine steady: the switch sits in a header */
  .tuwa-theme-switch__knob--to-dark .tuwa-theme-switch__pixel--twinkle {
    animation: tuwa-twinkle-a 2s cubic-bezier(0.37, 0, 0.63, 1) calc(300ms + var(--twinkle-delay) / 3) both;
  }
  .tuwa-theme-switch__knob--to-light .tuwa-theme-switch__pixel--twinkle {

  @keyframes tuwa-twinkle-a {
    0%,
    100% {
      opacity: 1;
    }
    50% {
      opacity: 0.25;
    }
  }
  @keyframes tuwa-twinkle-b {
    0%,
    100% {
      opacity: 1;
    }
    50% {
      opacity: 0.25;
    }
  }

  /* A satellite around the moon, a planet around the sun: a pixel on a tilted orbit, upright all the way */
  .tuwa-theme-switch__orbit {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .tuwa-theme-switch__orbiter {
    position: absolute;
    top: 0;
    left: 0;
    width: calc(var(--pixel-step) * 0.8);
    height: calc(var(--pixel-step) * 0.8);
    background: var(--pixel);
    box-shadow: 0 0 4px var(--glow);
    offset-path: var(--orbit-path);
    offset-rotate: 0deg;
    opacity: 0;
  }
  /* One slow pass of the orbit after a change, easing in and out, then gone: nothing keeps moving in a header */
  .tuwa-theme-switch__knob--to-dark .tuwa-theme-switch__orbiter {
    animation: tuwa-orbit-a 2.2s cubic-bezier(0.37, 0, 0.63, 1) 300ms both;
  }
  .tuwa-theme-switch__knob--to-light .tuwa-theme-switch__orbiter {
    animation: tuwa-orbit-b 2.2s cubic-bezier(0.37, 0, 0.63, 1) 300ms both;
  }
  @keyframes tuwa-orbit-a {
    0% {
      offset-distance: 0%;
      opacity: 0;
    }
    20%,
    78% {
      opacity: 1;
    }
    100% {
      offset-distance: 100%;
      opacity: 0;
    }
  }
  @keyframes tuwa-orbit-b {
    0% {
      offset-distance: 0%;
      opacity: 0;
    }
    20%,
    78% {
      opacity: 1;
    }
    100% {
      offset-distance: 100%;
      opacity: 0;
    }
  }

  /* The language switch, a pair with the theme switch: the flag of the language on the same knob, a soft glow in the

  .tuwa-locale-switch__knob,

  /* The flags, as vectors with a hair edge so they hold their shape on a white page; a new one comes in softly */
