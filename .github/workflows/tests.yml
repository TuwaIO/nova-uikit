name: Tests

# The unit tests of the packages, and every Storybook story rendered in Chromium and checked with axe: a story with an
# accessibility violation fails the run (`a11y.test: 'error'` in .storybook/preview.tsx)
on:
  push:
    branches:
      - main
      - 'dev/**'
      - 'fix/**'
      - 'feat/**'
  pull_request:

jobs:
  test:
    name: Unit and story tests
    runs-on: ubuntu-latest
    env:
      NODE_NO_WARNINGS: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      # The root postinstall builds the packages: the tests and the Storybook import their dist
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Install Chromium for the story tests
        run: pnpm --filter @tuwaio/storybook exec playwright install --with-deps chromium

      - name: Story tests (render and axe)
        run: pnpm --filter @tuwaio/storybook test:stories
